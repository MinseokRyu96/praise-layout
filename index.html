<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>찬양 콘티 A3 악보 정리와 마커 표시 | PraiseLayout</title>

    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://praise-layout.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PraiseLayout" />
    <meta property="og:title" content="찬양 콘티 A3 악보 정리와 마커 표시 | PraiseLayout" />
    <meta
      property="og:description"
      content="찬양팀 콘티, Key, 흐름 메모, 악보 위 섹션 마커를 A3 PDF와 JPG로 빠르게 정리하세요."
    />
    <meta property="og:url" content="https://praise-layout.vercel.app/" />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0f766e" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8104838143348148"
      crossorigin="anonymous"
    ></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PraiseLayout",
        "url": "https://praise-layout.vercel.app/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web",
        "description": "찬양팀 콘티, Key, 흐름 메모, 악보 위 섹션 마커를 A3 PDF와 JPG로 정리하는 웹 도구입니다.",
        "featureList": [
          "찬양 콘티명과 예배 날짜 입력",
          "곡명과 Key 정리",
          "악보 이미지와 PDF 업로드",
          "V, Ch, P.C, Br 섹션 마커 표시",
          "A3 PDF 다운로드",
          "페이지별 JPG 다운로드"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "KRW"
        }
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=40" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#top" aria-label="PraiseLayout home">
          <span class="brand-mark">PL</span>
          <span>
            <strong>PraiseLayout</strong>
            <small>A3 worship sheet maker</small>
          </span>
        </a>
        <nav class="nav-list" aria-label="주요 메뉴">
          <a class="active" href="#composer">새 콘티</a>
          <a href="#songs">곡 입력</a>
          <a href="#preview">A3 미리보기</a>
        </nav>
        <div class="policy-note">
          업로드한 악보 파일은 사용 권한을 가진 자료여야 하며, 생성 PDF는 팀 내부 사용을 목적으로 합니다.
        </div>
        <nav class="footer-links" aria-label="사이트 정보">
          <a href="./about">서비스 소개</a>
          <a href="./guide">사용 가이드</a>
          <a href="./privacy">개인정보처리방침</a>
          <a href="./terms">이용약관</a>
          <a href="./contact">문의</a>
        </nav>
      </aside>

      <main id="top" class="workspace">
        <header class="topbar">
          <div>
            <h1>찬양 콘티를 A3 악보와 섹션 마커로 정리</h1>
          </div>
          <div class="top-actions">
            <button id="saveButton" class="ghost-button" type="button">저장</button>
            <button id="jpgButton" class="secondary-button" type="button">JPG 다운로드</button>
            <button id="printButton" class="primary-button" type="button">PDF 다운로드</button>
          </div>
        </header>

        <section id="composer" class="panel intro-panel">
          <div class="composer-main">
            <div class="setlist-form">
              <label>
                콘티명
                <input id="setlistTitle" type="text" placeholder="예: 주일 2부 예배 찬양 콘티" />
              </label>
              <label>
                예배 날짜
                <input id="worshipDate" type="date" />
              </label>
              <label>
                곡 수
                <select id="songCount">
                  <option value="3">3곡</option>
                  <option value="4" selected>4곡</option>
                  <option value="5">5곡</option>
                  <option value="6">6곡</option>
                </select>
              </label>
            </div>
            <div class="layout-quick-settings" aria-label="A3 출력 설정">
              <label>
                방향
                <select id="orientation">
                  <option value="landscape" selected>A3 가로</option>
                  <option value="portrait">A3 세로</option>
                </select>
              </label>
              <label>
                장당 곡 수
                <select id="songsPerPage">
                  <option value="1">1곡</option>
                  <option value="2" selected>2곡</option>
                  <option value="3">3곡</option>
                  <option value="4">4곡</option>
                </select>
              </label>
              <label>
                여백
                <select id="marginMode">
                  <option value="tight">좁게</option>
                  <option value="normal" selected>기본</option>
                  <option value="wide">넓게</option>
                </select>
              </label>
              <label>
                표시
                <span class="checkbox-row">
                  <input id="showMeta" type="checkbox" checked />
                  제목/흐름
                </span>
              </label>
            </div>
          </div>
        </section>

        <section id="songs" class="panel">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Step 1</p>
              <h2>곡 정보 입력</h2>
            </div>
          </div>
          <div id="songList" class="song-list"></div>
        </section>

        <section id="preview" class="preview-section">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Step 2</p>
              <h2>출력 미리보기</h2>
            </div>
            <span id="fileNameHint" class="file-name-hint"></span>
          </div>
          <div id="warningBox" class="warning-box" hidden></div>
          <div id="previewCanvas" class="preview-canvas" aria-live="polite"></div>
        </section>
      </main>
      <footer class="mobile-site-footer" aria-label="사이트 정보">
        <nav class="footer-links">
          <a href="./about">서비스 소개</a>
          <a href="./guide">사용 가이드</a>
          <a href="./privacy">개인정보처리방침</a>
          <a href="./terms">이용약관</a>
          <a href="./contact">문의</a>
        </nav>
      </footer>
    </div>

    <script src="./src/app.js?v=42"></script>
  </body>
</html>
