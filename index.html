  <body>
    <div class="app-shell">
      <main id="top" class="workspace">
        <header class="topbar">
          <div>
            <h1>찬양팀 콘티 제작기</h1>
          </div>
          <div class="top-actions">
            <button id="saveButton" class="ghost-button" type="button">저장</button>
            <button id="jpgButton" class="secondary-button" type="button">
              <span class="desktop-label">JPG 다운로드</span>
              <span class="mobile-label">JPG</span>
            </button>
            <button id="printButton" class="primary-button" type="button">
              <span class="desktop-label">PDF 다운로드</span>
              <span class="mobile-label">PDF</span>
            </button>
          </div>
        </header>

        <div class="split-workbench">
          <div class="editor-column">
            <section id="composer" class="panel intro-panel">
              <div class="composer-main">
                <div class="setlist-form">
                  <label>
                    콘티명
                    <input id="setlistTitle" type="text" placeholder="예: 주일 2부 예배 찬양 콘티" />
                  </label>
                  <label>
                    예배 날짜
                    <input id="worshipDate" type="date" />
                  </label>
                  <label>
                    곡 수
                    <select id="songCount">
                      <option value="1">1곡</option>
                      <option value="2">2곡</option>
                      <option value="3">3곡</option>
                      <option value="4" selected>4곡</option>
                      <option value="5">5곡</option>
                      <option value="6">6곡</option>
                    </select>
                  </label>
                </div>
                <div class="layout-quick-settings" aria-label="A3 출력 설정">
                  <label>
                    방향
                    <select id="orientation">
                      <option value="landscape" selected>A3 가로</option>
                      <option value="portrait">A3 세로</option>
                    </select>
                  </label>
                  <label>
                    장당 곡 수
                    <select id="songsPerPage">
                      <option value="1">1곡</option>
                      <option value="2" selected>2곡</option>
                      <option value="3">3곡</option>
                      <option value="4">4곡</option>
                    </select>
                  </label>
                  <label>
                    여백
                    <select id="marginMode">
                      <option value="tight">좁게</option>
                      <option value="normal" selected>기본</option>
                      <option value="wide">넓게</option>
                    </select>
                  </label>
                  <label>
                    표시
                    <span class="checkbox-row">
                      <input id="showMeta" type="checkbox" checked />
                      제목/흐름 표시
                    </span>
                  </label>
                </div>
              </div>
            </section>

            <section id="songs" class="panel">
              <div class="section-heading">
                <div>
                  <p class="eyebrow">콘티 작성</p>
                  <h2>곡 정보</h2>
                </div>
              </div>
              <div id="songList" class="song-list"></div>
            </section>
          </div>

          <section id="preview" class="preview-section">
            <div class="section-heading">
              <div>
                <p class="eyebrow">악보 확인</p>
                <h2>미리보기</h2>
              </div>
              <span id="fileNameHint" class="file-name-hint"></span>
            </div>
            <div id="warningBox" class="warning-box" hidden></div>
            <div id="previewCanvas" class="preview-canvas" aria-live="polite"></div>
          </section>
        </div>
      </main>
      <footer class="site-footer" aria-label="사이트 정보">
        <div class="site-footer-inner">
          <p class="footer-summary">
            찬양팀 콘티 제작기: 예배 콘티, A3 악보 정리, PDF/JPG 다운로드, 섹션 마커 표시를 지원합니다.

          </nav>
        </div>
